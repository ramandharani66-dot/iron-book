<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IronBook — Gym Membership Manager</title>

    <meta
      name="description"
      content="Track gym members, renewals, check-ins and payments."
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <link rel="icon" type="image/png" href="./favicon.png" />

    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      crossorigin
      href="./assets/index-DthAY8Bp.css"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module">
      try {
        await import("./firebase-backend.js");
        await import("./assets/index-Dh8Xv2qj.js");
      } catch (error) {
        console.error("IronBook initialization failed:", error);

        const box = document.createElement("pre");

        box.style.cssText =
          "padding:24px;white-space:pre-wrap;background:#fff;color:#111;";

        box.textContent = [
          "IronBook could not start.",
          String(error?.message || error),
          "Please copy this message and share it for troubleshooting."
        ].join("\n");

        document.body.appendChild(box);
      }
    </script>

    <script>
(function () {
  var saved = localStorage.getItem("ironbook-theme");
  var dark = saved !== "light";

  function applyTheme() {
    document.documentElement.classList.toggle("dark", dark);
  }

  applyTheme();

  var button = document.createElement("button");
  button.type = "button";
  button.setAttribute("aria-label", "Change theme");
  button.style.position = "fixed";
  button.style.right = "16px";
  button.style.bottom = "16px";
  button.style.zIndex = "9999";
  button.style.padding = "10px 14px";
  button.style.borderRadius = "999px";
  button.style.border = "1px solid rgba(128,128,128,.4)";
  button.style.background = dark ? "#111827" : "#ffffff";
  button.style.color = dark ? "#ffffff" : "#111827";
  button.style.fontSize = "14px";
  button.style.fontWeight = "600";
  button.style.cursor = "pointer";
  button.style.boxShadow = "0 4px 12px rgba(0,0,0,.25)";
  button.textContent = dark ? "☀️ Light" : "🌙 Dark";

  button.addEventListener("click", function () {
    dark = !dark;
    localStorage.setItem("ironbook-theme", dark ? "dark" : "light");
    applyTheme();
    button.textContent = dark ? "☀️ Light" : "🌙 Dark";
    button.style.background = dark ? "#111827" : "#ffffff";
    button.style.color = dark ? "#ffffff" : "#111827";
  });

    document.body.appendChild(button);

  var info = document.createElement("a");
  info.href = "./about.html";
  info.setAttribute("aria-label", "About and privacy");
  info.style.position = "fixed";
  info.style.right = "16px";
  info.style.bottom = "64px";
  info.style.zIndex = "9999";
  info.style.width = "44px";
  info.style.height = "44px";
  info.style.display = "grid";
  info.style.placeItems = "center";
  info.style.borderRadius = "999px";
  info.style.border = "1px solid rgba(128,128,128,.4)";
  info.style.background = "#111827";
  info.style.color = "#ffffff";
  info.style.fontSize = "18px";
  info.style.fontWeight = "700";
  info.style.textDecoration = "none";
  info.style.cursor = "pointer";
  info.style.boxShadow = "0 4px 12px rgba(0,0,0,.25)";
  info.textContent = "ℹ️";

  document.body.appendChild(info);
})();
})();
    </script>
  </body>
</html>
